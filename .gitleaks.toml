# Gitleaks v8.30.1에서 검증한 프로젝트 공통 설정.
title = "Loop Harness Project secret scanning"

# 설치된 Gitleaks 바이너리의 기본 탐지 규칙을 상속한다.
[extend]
useDefault = true

# 프로젝트 전용 allowlist는 추가하지 않는다.
# .gitignore는 Git 추적 정책이며, 검사 예외 목록으로 복사하지 않는다.
# 오탐이 확인되면 해당 규칙과 값에 한정해 예외를 검토한다.

# 프로젝트 루트에서 실행한다. --redact는 출력의 비밀값을 가린다.
# 현재 파일 검사:
# gitleaks dir --config .gitleaks.toml --redact .
# Git 저장소 생성 후 스테이징한 변경 검사:
# gitleaks git --pre-commit --staged --config .gitleaks.toml --redact .
# Git 커밋 이력 검사:
# gitleaks git --log-opts="--all" --config .gitleaks.toml --redact .
# 이 파일만으로 자동 검사가 실행되지는 않는다. hook 또는 CI 연결은 별도다.
